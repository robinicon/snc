name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-windows:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        preset: [minimal, normal, full]
        config: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        working-directory: snc_cpp
        run: cmake --preset=${{ matrix.preset }}

      - name: Build
        working-directory: snc_cpp
        run: cmake --build --preset=${{ matrix.preset }} --config ${{ matrix.config }}

  build-linux:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        preset: [minimal, normal, full]
        config: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Configure CMake
        working-directory: snc_cpp
        run: cmake --preset=${{ matrix.preset }} -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        working-directory: snc_cpp
        run: cmake --build build-${{ matrix.preset }} --config ${{ matrix.config }} -j$(nproc)

  build-macos:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        preset: [minimal]
        config: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake

      - name: Configure CMake
        working-directory: snc_cpp
        run: cmake --preset=${{ matrix.preset }} -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        working-directory: snc_cpp
        run: cmake --build build-${{ matrix.preset }} --config ${{ matrix.config }} -j$(sysctl -n hw.logicalcpu)
